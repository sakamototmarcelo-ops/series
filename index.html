<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Meus filmes</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe4ec;--accent:#6d5dfc;--accent2:#5144d7;--danger:#d64545;--shadow:0 8px 25px #1b2b4a12}
    @media(prefers-color-scheme:dark){:root{--bg:#101522;--card:#182132;--text:#eef2ff;--muted:#aab4c8;--line:#2b3850;--shadow:0 8px 25px #0005}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;min-height:44px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}button.danger{background:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);padding:10px 12px}textarea{min-height:80px;resize:vertical}label{display:block;font-size:.88rem;font-weight:700;margin:11px 0 5px}.wrap{max-width:760px;margin:auto;padding:18px 15px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:1.6rem;margin:0}.sub{color:var(--muted);margin:3px 0 18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}.search{display:flex;gap:8px}.search input{flex:1}.hint,.muted{color:var(--muted);font-size:.9rem}.results{display:grid;gap:8px;margin-top:12px}.result{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);padding:8px;min-height:70px}.poster{width:64px;height:92px;object-fit:cover;border-radius:8px;background:#dce2ec;flex:none}.poster.small{width:48px;height:70px}.poster.empty{display:grid;place-items:center;color:#7c8799;font-size:11px;text-align:center}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.movie{display:flex;gap:12px;align-items:flex-start}.movie-body{flex:1;min-width:0}.movie h3{margin:0 0 3px;font-size:1.05rem}.badge{display:inline-block;border-radius:99px;background:#edeaff;color:var(--accent2);padding:3px 8px;font-size:.78rem;margin:2px 3px 2px 0}.rating{font-weight:800;color:#e69500}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{min-height:40px;padding:8px 11px;font-size:.86rem}.empty-state{text-align:center;color:var(--muted);padding:25px 10px}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}.tabs button{background:transparent;color:var(--muted);border-radius:0;min-height:64px;flex:1;max-width:150px;padding:7px 3px;font-size:.72rem}.tabs button.active{color:var(--accent);border-top:3px solid var(--accent)}.tab-icon{display:block;font-size:1.3rem}.toast{position:fixed;z-index:20;bottom:78px;left:50%;transform:translateX(-50%);background:#222b3d;color:#fff;padding:11px 15px;border-radius:12px;max-width:92%;box-shadow:var(--shadow)}.modal{position:fixed;inset:0;z-index:10;background:#0008;display:grid;place-items:end center;padding:10px}.modal-box{width:min(100%,720px);max-height:92vh;overflow:auto;background:var(--card);border-radius:18px;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.close{background:transparent;color:var(--muted);font-size:1.5rem;padding:3px;min-height:40px}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:13px}.stat strong{display:block;font-size:1.5rem}.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.hidden{display:none!important}h2{margin:5px 0 14px}h3{margin:14px 0 7px}.switch{display:flex;gap:8px}.switch button{flex:1}.link{color:var(--accent);text-decoration:underline;cursor:pointer;background:transparent;padding:0;min-height:0}.danger-text{color:var(--danger)}@media(min-width:600px){.grid2{grid-template-columns:repeat(3,1fr)}.stat-grid{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><h1>🎬 Meus filmes</h1><p class="sub">Seu registro pessoal de cinema</p></div><button class="secondary" id="settingsBtn" aria-label="Configurações">⚙️</button></header>
  <section id="libraryView">
    <div class="panel"><div class="switch"><button id="watchedBtn">Assistidos</button><button class="secondary" id="wantBtn">Quero assistir</button></div><div class="row" style="margin-top:10px"><select id="sort"><option value="rating">Minha nota</option><option value="watchedAt">Data assistida</option><option value="release">Ano de lançamento</option><option value="title">Título</option></select><button class="secondary" id="manualBtn">+ Manual</button></div><div class="grid2"><div><label for="genreFilter">Gênero</label><select id="genreFilter"><option value="">Todos</option></select></div><div><label for="yearFilter">Ano</label><select id="yearFilter"><option value="">Todos</option></select></div><div><label for="actorFilter">Ator</label><input id="actorFilter" placeholder="Nome do ator"></div></div></div>
    <div id="movieList"></div>
  </section>
  <section id="topView" class="hidden"><h2>🎬 Todos os cadastrados</h2><div id="topList"></div></section>
  <section id="statsView" class="hidden"><h2>📊 Estatísticas</h2><div id="stats"></div></section>
</main>
<nav class="tabs"><button class="active" data-tab="library"><span class="tab-icon">🎞️</span>Biblioteca</button><button data-tab="top"><span class="tab-icon">🎬</span>Lista</button><button data-tab="stats"><span class="tab-icon">📊</span>Estatísticas</button></nav>
  <div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
// Aplicativo autocontido: os registros e a chave ficam apenas no armazenamento do aparelho.
const KEY='meus-filmes-v1', API_KEY='meus-filmes-tmdb-key', state={list:'watched',tab:'library',records:[],apiKey:''};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])), year=d=>d?String(d).slice(0,4):'—';
function read(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){toast('Não foi possível salvar no aparelho.');return false}}
function save(){write(KEY,state.records);try{localStorage.setItem(API_KEY,state.apiKey||'')}catch(e){toast('Não foi possível salvar a configuração.')}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3300)}
function img(src,small=false){return src?`<img class="poster ${small?'small':''}" loading="lazy" src="${esc(src)}" alt="Pôster">`:`<div class="poster ${small?'small ':''}empty">Sem<br>pôster</div>`}
function normalize(m,extra={}){return {tmdbId:m.id||extra.tmdbId||null,title:m.title||m.name||extra.title||'',originalTitle:m.original_title||extra.originalTitle||'',releaseDate:m.release_date||extra.releaseDate||'',director:extra.director||'',cast:extra.cast||[],genres:extra.genres||[],runtime:extra.runtime||null,overview:m.overview||extra.overview||'',poster:m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:(extra.poster||''),status:extra.status||'want',rating:extra.rating??'',watchedAt:extra.watchedAt||'',where:extra.where||'',comment:extra.comment||'',createdAt:extra.createdAt||Date.now()}}
function load(){const arr=read(KEY,[]);state.records=Array.isArray(arr)?arr:[];try{state.apiKey=localStorage.getItem(API_KEY)||''}catch(e){state.apiKey=''}render()}
async function api(path){if(!state.apiKey)throw Error('NO_KEY');const r=await fetch(`https://api.themoviedb.org/3${path}${path.includes('?')?'&':'?'}api_key=${encodeURIComponent(state.apiKey)}&language=pt-BR`);if(r.status===401)throw Error('BAD_KEY');if(!r.ok)throw Error('NETWORK');return r.json()}
async function searchTVMaze(q){const box=$('#results');try{const r=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);if(!r.ok)throw Error();const data=await r.json();if(!data.length){box.innerHTML='<p class="empty-state">Nenhuma série encontrada. Você pode cadastrar manualmente.</p>';return}box.innerHTML='<p class="hint">Resultados gratuitos do TVmaze — séries</p>'+data.slice(0,12).map(x=>{const s=x.show;return `<button class="result" data-tvmaze="${Number(s.id)}">${img(s.image?.medium||'',true)}<span><strong>${esc(s.name)}</strong><br><span class="muted">${esc(year(s.premiered))} · Série</span></span></button>`}).join('');box.querySelectorAll('[data-tvmaze]').forEach(b=>b.onclick=()=>selectTVMaze(b.dataset.tvmaze))}catch(e){box.innerHTML='<p class="empty-state">Não foi possível consultar a base gratuita de séries. Tente novamente ou cadastre manualmente.</p>'}}
async function searchMovies(){const q=$('#searchInput').value.trim();if(!q)return;const box=$('#results');box.innerHTML='<p class="hint">Buscando filmes e séries…</p>';try{const data=await api(`/search/multi?query=${encodeURIComponent(q)}&include_adult=false&page=1`);const results=(data.results||[]).filter(m=>m.media_type==='movie'||m.media_type==='tv');if(!results.length){await searchTVMaze(q);return}box.innerHTML=results.slice(0,12).map(m=>{const title=m.title||m.name||'Sem título',date=m.release_date||m.first_air_date;return `<button class="result" data-id="${Number(m.id)}" data-type="${esc(m.media_type)}">${img(m.poster_path?`https://image.tmdb.org/t/p/w185${m.poster_path}`:'',true)}<span><strong>${esc(title)}</strong><br><span class="muted">${esc(year(date))} · ${m.media_type==='tv'?'Série':'Filme'}</span></span></button>`}).join('');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectMovie(b.dataset.id,b.dataset.type))}catch(e){if(e.message==='NO_KEY'){await searchTVMaze(q);return}box.innerHTML=`<p class="empty-state">${e.message==='BAD_KEY'?'A chave do TMDB parece inválida.':'Não foi possível acessar o TMDB. Verifique sua internet.'}</p>`}}
async function selectMovie(id,type='movie'){try{const m=await api(`/${type==='tv'?'tv':'movie'}/${id}?append_to_response=credits`);const crew=m.credits?.crew||[], cast=(m.credits?.cast||[]).slice(0,5).map(x=>x.name), normalized=normalize({...m,title:m.title||m.name,original_title:m.original_title||m.original_name,release_date:m.release_date||m.first_air_date},{status:'want',director:crew.find(x=>x.job==='Director')?.name||crew.find(x=>x.job==='Creator')?.name||m.created_by?.[0]?.name||'',cast,genres:(m.genres||[]).map(x=>x.name)});openEditor(normalized)}catch(e){toast('Não foi possível carregar os detalhes do resultado.')}}
async function selectTVMaze(id){try{const r=await fetch(`https://api.tvmaze.com/shows/${encodeURIComponent(id)}?embed[]=cast&embed[]=crew`);if(!r.ok)throw Error();const s=await r.json(),clean=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(),cast=(s._embedded?.cast||[]).slice(0,5).map(x=>x.person?.name).filter(Boolean),director=(s._embedded?.crew||[]).find(x=>/director|creator/i.test(x.type||''))?.person?.name||'',m={id:`tvmaze:${s.id}`,title:s.name,original_title:s.name,release_date:s.premiered||'',overview:clean(s.summary),poster:s.image?.original||s.image?.medium||'',status:'want',cast,genres:s.genres||[],director,runtime:s.runtime||s.averageRuntime||null};openEditor(normalize({},m))}catch(e){toast('Não foi possível carregar os detalhes da série.')}}
function openSearch(initial=''){openModal(`<div class="modal-head"><h2>Buscar filme ou série</h2><button class="close" data-close>×</button></div><p class="hint">A busca usa o TMDB quando há chave. Se não houver resultado ou chave, consulta automaticamente o TVmaze, que é gratuito e funciona bem para séries.</p><div class="search"><input id="searchInput" placeholder="Título do filme ou série" value="${esc(initial)}"><button id="searchBtn">Buscar</button></div><div class="actions"><button class="secondary" id="seriesBtn">📺 Buscar série sem chave</button><button class="secondary" id="manualFromSearch">Cadastrar manualmente</button></div><div id="results"></div>`);$('#searchBtn').onclick=searchMovies;$('#seriesBtn').onclick=()=>{const q=$('#searchInput').value.trim();if(q)searchTVMaze(q);else toast('Digite um título primeiro.')};$('#manualFromSearch').onclick=()=>{closeModal();openEditor()};$('#searchInput').onkeydown=e=>{if(e.key==='Enter')searchMovies()};if(initial)searchMovies()}
function openEditor(m=normalize({}, {status:'want'})){openModal(`<div class="modal-head"><h2>${m.tmdbId?'Detalhes do filme':'Cadastro manual'}</h2><button class="close" data-close>×</button></div>${m.tmdbId?`<div class="movie">${img(m.poster)}<div><strong>${esc(m.title)}</strong><p class="muted">${esc(m.originalTitle)} · ${esc(year(m.releaseDate))}</p></div></div>`:''}<label>Título em português</label><input id="fTitle" value="${esc(m.title)}"><label>Título original</label><input id="fOriginal" value="${esc(m.originalTitle)}"><div class="grid2"><div><label>Data de lançamento</label><input id="fRelease" type="date" value="${esc(m.releaseDate)}"></div><div><label>Duração (minutos)</label><input id="fRuntime" type="number" min="1" value="${m.runtime||''}"></div></div><label>Diretor</label><input id="fDirector" value="${esc(m.director)}"><label>Elenco principal (separe por vírgulas)</label><input id="fCast" value="${esc(m.cast.join(', '))}"><label>Gêneros (separe por vírgulas)</label><input id="fGenres" value="${esc(m.genres.join(', '))}"><label>Sinopse</label><textarea id="fOverview">${esc(m.overview)}</textarea><label>Pôster (URL opcional)</label><input id="fPoster" value="${esc(m.poster)}" placeholder="https://..."><hr><div class="grid2"><div><label>Lista</label><select id="fStatus"><option value="watched" ${m.status==='watched'?'selected':''}>Assistidos</option><option value="want" ${m.status!=='watched'?'selected':''}>Quero assistir</option></select></div><div><label>Onde assisti</label><select id="fWhere"><option value="">—</option><option>Cinema</option><option>Streaming</option><option>TV</option><option>Outro</option></select></div></div><div class="grid2"><div><label>Minha nota (0 a 10)</label><input id="fRating" type="number" min="0" max="10" step="0.5" value="${m.rating}"></div><div><label>Data em que assisti</label><input id="fWatched" type="date" value="${m.watchedAt||new Date().toISOString().slice(0,10)}"></div></div><label>Comentário curto</label><textarea id="fComment">${esc(m.comment)}</textarea><div class="actions"><button id="saveMovie">Salvar filme</button><button class="secondary" data-close>Cancelar</button></div>`);$('#fWhere').value=m.where||'';$('#saveMovie').onclick=()=>saveEditor(m)}
function saveEditor(old){const title=$('#fTitle').value.trim();if(!title){toast('Informe o título.');return}let status=$('#fStatus').value,rating=$('#fRating').value;const record={...old,title,originalTitle:$('#fOriginal').value.trim(),releaseDate:$('#fRelease').value,director:$('#fDirector').value.trim(),cast:$('#fCast').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10),genres:$('#fGenres').value.split(',').map(x=>x.trim()).filter(Boolean),runtime:Number($('#fRuntime').value)||null,overview:$('#fOverview').value.trim(),poster:$('#fPoster').value.trim(),status,rating:status==='watched'&&rating!==''?Math.max(0,Math.min(10,Number(rating))):'',watchedAt:status==='watched'?$('#fWatched').value:'',where:status==='watched'?$('#fWhere').value:'',comment:status==='watched'?$('#fComment').value.trim():''};const duplicate=state.records.findIndex(x=>x.tmdbId&&record.tmdbId&&x.tmdbId===record.tmdbId&&x!==old);if(duplicate>=0){toast('Este filme já está cadastrado.');return}const ix=state.records.indexOf(old);if(ix>=0)state.records[ix]=record;else state.records.unshift(record);save();closeModal();render();toast('Filme salvo!')}
function render(){renderFilters();if(state.tab!=='library')return;const watched=state.records.filter(x=>x.status==='watched');let list=state.records.filter(x=>x.status===state.list);const g=$('#genreFilter').value,y=$('#yearFilter').value,a=$('#actorFilter').value.trim().toLowerCase();if(state.list==='watched'){if(g)list=list.filter(x=>x.genres.includes(g));if(y)list=list.filter(x=>year(x.releaseDate)===y);if(a)list=list.filter(x=>x.cast.some(c=>c.toLowerCase().includes(a)));const s=$('#sort').value;list.sort((p,q)=>s==='rating'?(Number(q.rating||-1)-Number(p.rating||-1))||String(q.watchedAt).localeCompare(String(p.watchedAt)):s==='watchedAt'?String(q.watchedAt).localeCompare(String(p.watchedAt)):s==='release'?year(q.releaseDate).localeCompare(year(p.releaseDate)):p.title.localeCompare(q.title,'pt-BR'))}$('#watchedBtn').className=state.list==='watched'?'':'secondary';$('#wantBtn').className=state.list==='want'?'':'secondary';$('#movieList').innerHTML=list.length?list.map(card).join(''):`<div class="empty-state">${state.list==='watched'?'Ainda não há filmes assistidos.':'Sua lista está vazia.'}<br><button style="margin-top:12px" id="firstSearch">Buscar filme</button></div>`;$('#movieList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(state.records.find(x=>x.createdAt==b.dataset.edit)));$('#movieList').querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>moveMovie(state.records.find(x=>x.createdAt==b.dataset.move)));$('#movieList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMovie(state.records.find(x=>x.createdAt==b.dataset.delete)));$('#firstSearch')?.addEventListener('click',openSearch)}
function card(m){return `<article class="card movie">${img(m.poster)}<div class="movie-body"><h3>${esc(m.title)}</h3><div class="muted">${esc(year(m.releaseDate))} · ${esc(m.genres.join(', ')||'Gênero não informado')}</div>${m.status==='watched'?`<div class="rating">★ ${esc(m.rating||'—')}/10 ${m.watchedAt?`· ${esc(m.watchedAt)}`:''}</div>`:'<span class="badge">Quero assistir</span>'}<div class="actions"><button class="secondary" data-edit="${m.createdAt}">Editar</button><button class="secondary" data-move="${m.createdAt}">${m.status==='watched'?'Mover para quero assistir':'Marcar como assistido'}</button><button class="danger" data-delete="${m.createdAt}">Excluir</button></div></div></article>`}
function renderFilters(){const watched=state.records.filter(x=>x.status==='watched'), genres=[...new Set(watched.flatMap(x=>x.genres))].sort(),years=[...new Set(watched.map(x=>year(x.releaseDate)).filter(x=>x!=='—'))].sort().reverse();const keepG=$('#genreFilter').value,keepY=$('#yearFilter').value;$('#genreFilter').innerHTML='<option value="">Todos</option>'+genres.map(x=>`<option>${esc(x)}</option>`).join('');$('#yearFilter').innerHTML='<option value="">Todos</option>'+years.map(x=>`<option>${esc(x)}</option>`).join('');$('#genreFilter').value=keepG;$('#yearFilter').value=keepY}
function moveMovie(m){if(!m)return;m.status=m.status==='watched'?'want':'watched';if(m.status==='watched'){const r=prompt('Nota de 0 a 10 (opcional):',m.rating||'');if(r!==null)m.rating=Math.max(0,Math.min(10,Number(r)||0));m.watchedAt=new Date().toISOString().slice(0,10)}else{m.rating='';m.watchedAt='';m.where='';m.comment=''}save();render()}
function deleteMovie(m){if(m&&confirm(`Excluir “${m.title}”?`)){state.records=state.records.filter(x=>x!==m);save();render();toast('Registro excluído.')}}
function openModal(html){$('#modalRoot').innerHTML=`<div class="modal"><div class="modal-box">${html}</div></div>`;$('#modalRoot').querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}function closeModal(){$('#modalRoot').innerHTML=''}
function settings(){openModal(`<div class="modal-head"><h2>Configurações</h2><button class="close" data-close>×</button></div><p class="hint">Sua chave v3 é salva somente no localStorage deste aparelho.</p><label>Chave API do TMDB</label><input id="apiKeyInput" type="password" value="${esc(state.apiKey)}" placeholder="Cole sua chave aqui"><div class="actions"><button id="saveKey">Salvar chave</button><button class="secondary" id="backup">Exportar backup</button><button class="secondary" id="restore">Importar backup</button><input id="fileInput" class="hidden" type="file" accept="application/json"></div><p class="hint">Os pôsteres são carregados diretamente do TMDB quando houver internet.</p>`);$('#saveKey').onclick=()=>{state.apiKey=$('#apiKeyInput').value.trim();save();closeModal();toast('Chave salva neste aparelho.')};$('#backup').onclick=exportBackup;$('#restore').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=importBackup}
function exportBackup(){const blob=new Blob([JSON.stringify({version:1,records:state.records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-filmes-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result),incoming=Array.isArray(data)?data:data.records;if(!Array.isArray(incoming))throw Error();let added=0;incoming.forEach(m=>{const exists=state.records.some(x=>m.tmdbId&&x.tmdbId?x.tmdbId===m.tmdbId:x.title.toLowerCase()===String(m.title||'').toLowerCase()&&x.releaseDate===m.releaseDate);if(!exists){state.records.push(normalize(m,m));added++}});save();closeModal();render();toast(`${added} filme(s) importado(s).`)}catch(x){toast('Arquivo de backup inválido.')}};rd.readAsText(file)}
function showTab(tab){state.tab=tab;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#libraryView').classList.toggle('hidden',tab!=='library');$('#topView').classList.toggle('hidden',tab!=='top');$('#statsView').classList.toggle('hidden',tab!=='stats');if(tab==='top')renderTop();if(tab==='stats')renderStats();if(tab==='library')render()}
function renderTop(){const list=state.records.filter(x=>x.status==='watched').sort((a,b)=>Number(b.rating||-1)-Number(a.rating||-1)||String(b.watchedAt).localeCompare(String(a.watchedAt))).slice(0,10);$('#topList').innerHTML=list.length?list.map((m,i)=>`<div class="card movie"><strong style="font-size:1.4rem;width:25px">${i+1}</strong>${img(m.poster,true)}<div><h3>${esc(m.title)}</h3><span class="rating">★ ${esc(m.rating)}/10</span><div class="muted">${esc(year(m.releaseDate))}</div></div></div>`).join(''):'<div class="empty-state">Adicione filmes assistidos para montar seu ranking.</div>'}
function renderStats(){const list=state.records.filter(x=>x.status==='watched'),avg=list.length?list.reduce((s,x)=>s+Number(x.rating||0),0)/list.length:0,count={};list.flatMap(x=>x.genres).forEach(g=>count[g]=(count[g]||0)+1);const topGenre=Object.entries(count).sort((a,b)=>b[1]-a[1])[0],byYear={};list.forEach(x=>{const y=year(x.watchedAt||x.releaseDate);byYear[y]=(byYear[y]||0)+1});$('#stats').innerHTML=`<div class="stat-grid"><div class="stat"><span class="muted">Total</span><strong>${list.length}</strong></div><div class="stat"><span class="muted">Nota média</span><strong>${avg.toFixed(1).replace('.',',')}</strong></div><div class="stat"><span class="muted">Gênero mais visto</span><strong style="font-size:1.1rem">${esc(topGenre?.[0]||'—')}</strong></div><div class="stat"><span class="muted">Na lista</span><strong>${state.records.filter(x=>x.status==='want').length}</strong></div></div><h3>Filmes por ano assistido</h3>${Object.entries(byYear).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,n])=>`<div class="row"><span>${esc(y)}</span><div class="bar"><i style="width:${Math.min(100,n/list.length*100)}%"></i></div><strong>${n}</strong></div>`).join('')||'<p class="muted">Sem dados ainda.</p>'}`}
$('#watchedBtn').onclick=()=>{state.list='watched';render()};$('#wantBtn').onclick=()=>{state.list='want';render()};$('#manualBtn').onclick=()=>openEditor();$('#settingsBtn').onclick=settings;$('#sort').onchange=render;$('#genreFilter').onchange=render;$('#yearFilter').onchange=render;$('#actorFilter').oninput=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));document.querySelector('.top').insertAdjacentHTML('afterend','<div class="panel" id="searchPanel"><div class="search"><input id="quickSearch" placeholder="Buscar filme ou série"><button id="quickBtn">🔎 Buscar</button></div></div>');$('#quickBtn').onclick=()=>openSearch($('#quickSearch').value.trim());$('#quickSearch').onkeydown=e=>{if(e.key==='Enter')openSearch($('#quickSearch').value.trim())};load();
